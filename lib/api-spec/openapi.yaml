openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for the Luma marketplace storefront
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: products
  - name: categories
  - name: cart
  - name: orders
  - name: upload
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current user or logged-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: Browse products
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/Category"
        - in: query
          name: minPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
      responses:
        "200":
          description: Product collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product listing
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product details
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update an owned product
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Unpublish an owned product
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Deleted product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryOption"
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current user's cart
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cart/{productId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update a cart quantity
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CartProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartQuantityInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a cart item
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CartProductId"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List buyer or seller orders
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [buying, selling]
            default: buying
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: checkout
      tags: [orders]
      summary: Convert the current cart into an order
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingAddress"
      responses:
        "201":
          description: Placed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order visible to a buyer or seller
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update an order status as a seller
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orders/summary:
    get:
      operationId: getSellerSummary
      tags: [orders]
      summary: Get seller dashboard summary
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Seller summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /upload:
    post:
      operationId: uploadImages
      tags: [upload]
      summary: Upload product gallery images
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Uploaded image metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Upload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: luma_session
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema: { type: string }
    CartProductId:
      in: path
      name: productId
      required: true
      schema: { type: string }
    OrderId:
      in: path
      name: id
      required: true
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
    AuthResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [user]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 100 }
      required: [name, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 100 }
      required: [email, password]
    Category:
      type: string
      enum: [electronics, clothing, home, books, toys, other]
    CategoryOption:
      type: object
      properties:
        value:
          $ref: "#/components/schemas/Category"
        label: { type: string }
        count: { type: integer, minimum: 0 }
      required: [value, label, count]
    ProductImage:
      type: object
      properties:
        url: { type: string, format: uri }
        publicId: { type: string }
      required: [url, publicId]
    Product:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 0 }
        category:
          $ref: "#/components/schemas/Category"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        stock: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        seller:
          $ref: "#/components/schemas/User"
        createdAt: { type: string, format: date-time }
      required: [id, title, description, price, category, images, stock, isActive, seller, createdAt]
    ProductInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 4000 }
        price: { type: integer, minimum: 1 }
        category:
          $ref: "#/components/schemas/Category"
        images:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/ProductImage"
        stock: { type: integer, minimum: 0, maximum: 100000 }
      required: [title, description, price, category, images, stock]
    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [data, pagination]
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
      required: [page, limit, total, totalPages]
    CartItemInput:
      type: object
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
      required: [productId, quantity]
    CartQuantityInput:
      type: object
      properties:
        quantity: { type: integer, minimum: 0, maximum: 99 }
      required: [quantity]
    CartItem:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/Product"
        quantity: { type: integer, minimum: 1 }
        priceAtAdd: { type: integer, minimum: 0 }
      required: [product, quantity, priceAtAdd]
    Cart:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal: { type: integer, minimum: 0 }
        itemCount: { type: integer, minimum: 0 }
      required: [id, items, subtotal, itemCount]
    ShippingAddress:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        line1: { type: string, minLength: 3, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 80 }
        postalCode: { type: string, minLength: 2, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 80 }
      required: [name, line1, city, state, postalCode, country]
    OrderItem:
      type: object
      properties:
        productId: { type: string }
        title: { type: string }
        price: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        image: { type: string, format: uri }
        sellerId: { type: string }
      required: [productId, title, price, quantity, image, sellerId]
    OrderStatus:
      type: string
      enum: [placed, shipped, cancelled]
    OrderStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
      required: [status]
    Order:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalAmount: { type: integer, minimum: 0 }
        status:
          $ref: "#/components/schemas/OrderStatus"
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        createdAt: { type: string, format: date-time }
        buyer:
          $ref: "#/components/schemas/User"
      required: [id, orderNumber, items, totalAmount, status, shippingAddress, createdAt, buyer]
    SellerSummary:
      type: object
      properties:
        activeListings: { type: integer, minimum: 0 }
        incomingOrders: { type: integer, minimum: 0 }
        revenue: { type: integer, minimum: 0 }
        pendingShipments: { type: integer, minimum: 0 }
      required: [activeListings, incomingOrders, revenue, pendingShipments]